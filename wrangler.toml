name = "deliricbae"
main = "worker.js"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "deliricbae.ro", custom_domain = true },
  { pattern = "aurumbots.com", custom_domain = true },
]

# Poarta cu parolă pentru accesul public la site.
[vars]
SITE_GATE = "on"

# Fisierele site-ului stau in public/ si sunt servite prin bindingul ASSETS.
# Worker-ul (worker.js) verifica parola inainte sa dea /api/reports.
[assets]
directory = "./public"
binding = "ASSETS"
# worker-ul ruleaza inaintea fisierelor statice (altfel poarta cu parola ar fi ocolita)
run_worker_first = true

# Stocare KV: rapoarte (cheia "latest") + unelte (cheia "tools_db").
[[kv_namespaces]]
binding = "DB"
id = "5625fad515024865bd472be5c8287076"
