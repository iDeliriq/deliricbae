<meta charset="utf-8">
<title>deliricbae tools</title>
<meta name="description" content="Unelte Baerim — calculatoare de upgrade și prețuri, salvate pentru fiecare user.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#080b16; --bg2:#0b1020; --panel:#111a30; --panel2:#152037; --panel3:#1b2947;
  --line:#243256; --line2:#33456f;
  --ink:#eaeefb; --mut:#9aa6c8; --dim:#5f6c93;
  --gold:#e7b954; --gold2:#f6d488; --goldd:#a9812c;
  --ok:#5fd39a; --bad:#e2685f;
  --sbw:250px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  color:var(--ink); font-family:"Poppins",system-ui,sans-serif; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1200px 600px at 78% -10%, rgba(231,185,84,.10), transparent 60%),
    radial-gradient(900px 500px at 8% 6%, rgba(90,120,255,.08), transparent 55%),
    var(--bg);
}
/* camp de stele desenat in cod (fara imagini externe) */
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 20% 30%, #fff, transparent),
    radial-gradient(1px 1px at 60% 70%, #cdd6ff, transparent),
    radial-gradient(1px 1px at 80% 20%, #fff, transparent),
    radial-gradient(1px 1px at 35% 80%, #e7d6a0, transparent),
    radial-gradient(1px 1px at 90% 55%, #fff, transparent),
    radial-gradient(1px 1px at 12% 62%, #b9c4ff, transparent),
    radial-gradient(2px 2px at 48% 18%, #fff, transparent);
  background-repeat:repeat;background-size:520px 520px;}
a{color:var(--gold2);text-decoration:none}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);z-index:40;
  background:linear-gradient(180deg,rgba(17,26,48,.96),rgba(11,16,32,.98));
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  transition:transform .22s ease;backdrop-filter:blur(4px)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.brand h1{font-family:"Cinzel",serif;font-weight:700;font-size:20px;margin:0;
  letter-spacing:1px;background:linear-gradient(180deg,var(--gold2),var(--goldd));
  -webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.brand .sub{color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.sbsearch{padding:0 14px 10px}
.sbsearch input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);
  background:var(--bg2);color:var(--ink);font-size:13px;font-family:inherit}
.sbsearch input:focus{outline:2px solid rgba(231,185,84,.4);border-color:var(--gold)}
.nav{flex:1;overflow:auto;padding:4px 8px 16px}
.grp{margin-bottom:2px}
.grphead{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  cursor:pointer;color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;user-select:none}
.grphead:hover{background:var(--panel2);color:var(--ink)}
.grphead .chev{margin-left:auto;transition:transform .18s;font-size:10px;color:var(--dim)}
.grp.open .chev{transform:rotate(90deg)}
.grpbody{display:none;padding:2px 0 6px 8px}
.grp.open .grpbody{display:block}
.navitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;
  cursor:pointer;color:var(--mut);font-size:13px;user-select:none}
.navitem:hover{background:var(--panel2);color:var(--ink)}
.navitem.active{color:var(--gold2);background:rgba(231,185,84,.10)}
.navitem .gem{width:12px;height:12px;flex:none}
.navitem .soon{margin-left:auto;font-size:9px;color:var(--dim);border:1px solid var(--line2);
  border-radius:5px;padding:0 5px;text-transform:uppercase}
.sbfoot{padding:10px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:10px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.main{margin-left:var(--sbw);min-height:100vh;transition:margin .22s}
body.hid .sidebar{transform:translateX(-100%)}
body.hid .main{margin-left:0}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;background:rgba(8,11,22,.85);backdrop-filter:blur(6px)}
.iconbtn{width:36px;height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{border-color:var(--gold)}
.crumbs{color:var(--dim);font-size:13px}
.crumbs b{color:var(--gold2);font-weight:600}
.content{padding:20px;max-width:1000px}

/* ---------- item header ---------- */
.ihead{display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;
  box-shadow:0 14px 34px -20px rgba(0,0,0,.8)}
.ihead .ic{width:56px;height:56px;flex:none;border-radius:12px;background:var(--bg2);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.ihead h2{font-family:"Cinzel",serif;margin:0;font-size:22px;letter-spacing:.5px}
.ihead .toggle{margin-left:auto;display:flex;background:var(--bg2);border:1px solid var(--line2);
  border-radius:10px;overflow:hidden}
.ihead .toggle button{border:0;background:transparent;color:var(--mut);padding:8px 14px;cursor:pointer;
  font-family:inherit;font-size:13px}
.ihead .toggle button.on{background:linear-gradient(180deg,var(--gold),var(--goldd));color:#1a1204;font-weight:600}

.sect{font-family:"Cinzel",serif;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--gold2);margin:22px 2px 10px}

/* ---------- enhancement table ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-size:12px}
th{color:var(--gold2);font-family:"JetBrains Mono",monospace;font-weight:600;background:var(--panel2)}
td.lbl,th.lbl{text-align:left;color:var(--mut);white-space:nowrap;position:sticky;left:0;background:var(--panel)}
.matchip{display:inline-flex;align-items:center;gap:4px;background:var(--panel3);border:1px solid var(--line2);
  border-radius:7px;padding:2px 6px;margin:2px;font-size:11px;white-space:nowrap}
.matchip .q{color:var(--gold2);font-family:"JetBrains Mono",monospace}
.taxrow td{color:var(--gold2);font-family:"JetBrains Mono",monospace;font-weight:600}

/* ---------- stages ---------- */
.stage{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:12px;margin-bottom:10px;overflow:hidden}
.stage.dim{opacity:.5}
.stagehd{display:flex;align-items:center;gap:12px;padding:11px 14px;flex-wrap:wrap}
.stagehd .lv{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--gold2)}
.stagehd label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.stagehd select{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:7px;
  padding:5px 7px;font-family:inherit;font-size:12px}
.stagehd .sub{margin-left:auto;font-family:"JetBrains Mono",monospace;color:var(--gold2);font-weight:600}
.stbody{border-top:1px solid var(--line);padding:6px 14px 10px}
.matline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.matline:last-child{border-bottom:0}
.matline .nm{color:var(--mut)}
.matline .q{color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:12px}
.matline .price{margin-left:auto;display:flex;align-items:center;gap:6px}
.matline input{width:120px;background:var(--bg2);border:1px solid var(--line2);color:var(--gold2);
  border-radius:7px;padding:5px 8px;text-align:right;font-family:"JetBrains Mono",monospace;font-size:12px}
.matline input:focus{outline:2px solid rgba(231,185,84,.35);border-color:var(--gold)}
.matline .tot{color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:12px;width:110px;text-align:right}
.matline .unit{color:var(--dim);font-family:"JetBrains Mono",monospace;font-size:11px;width:96px;text-align:right}
.taxline{color:var(--gold2)}
.total{position:sticky;bottom:0;margin-top:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--gold);border-radius:14px;padding:16px 18px;display:flex;align-items:center;
  box-shadow:0 -10px 30px -18px rgba(231,185,84,.5)}
.total .lbl{font-family:"Cinzel",serif;letter-spacing:1px}
.total .val{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:600;font-size:26px;color:var(--gold2)}
.craft{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.note{color:var(--dim);font-size:12px;margin:8px 2px}
.badge{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gold2);border:1px solid var(--goldd);
  background:rgba(231,185,84,.10);border-radius:999px;padding:3px 9px}

@media (max-width:900px){
  .sidebar{transform:translateX(-100%)} body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .main{margin-left:0}
}

#betaGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center}
#betaGate.show{display:flex}
#betaGate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 26px;width:340px;text-align:center;box-shadow:0 20px 60px -20px #000}
#betaGate h3{font-family:"Cinzel",serif;color:var(--gold2);margin:0 0 6px;letter-spacing:1px}
#betaGate p{color:var(--mut);font-size:13px;margin:0 0 16px}
#betaGate input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:14px;font-family:inherit}
#betaGate input:focus{outline:2px solid rgba(231,185,84,.4);border-color:var(--gold)}
#betaGate button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--gold),var(--goldd));color:#1a1204;font-weight:600;font-family:"Cinzel",serif;letter-spacing:.5px;cursor:pointer}
#betaGate .err{color:var(--bad);font-size:12.5px;min-height:16px;margin-top:10px}
</style>
<div class="stars"></div>
<div id="betaGate"><div class="card">
  <h3>deliricbae · beta</h3>
  <p>Introdu parola ca sa vezi versiunea beta.</p>
  <input id="bpw" type="password" autocomplete="current-password" placeholder="Parola">
  <button id="bbtn">Intra</button>
  <div class="err" id="berr"></div>
</div></div>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32"><polygon points="16,2 30,16 16,30 2,16" fill="#1b2947"/>
      <polygon points="16,2 30,16 16,16" fill="#f6d488"/><polygon points="2,16 16,30 16,16" fill="#a9812c"/>
      <polygon points="16,2 16,16 2,16" fill="#e7b954"/><polygon points="16,2 30,16 16,30 2,16" fill="none" stroke="#080b16" stroke-width="1.4"/></svg>
    <div><h1>DELIRICBAE</h1><div class="sub">Baerim tools</div></div>
  </div>
  <div class="sbsearch"><input id="search" placeholder="🔍 Caută unealtă / item..."></div>
  <div class="nav" id="nav"></div>
  <div class="sbfoot">Prototip · date demo · © deliricbae</div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar">
    <button class="iconbtn" id="toggle" title="Ascunde/arată meniul">☰</button>
    <div class="crumbs" id="crumbs">Acasă / <b>Chapter I</b> / Weapons / 75lvl weapon</div>
    <span class="badge" style="margin-left:auto">date demo</span>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
// ============ meniu pe categorii (extensibil) ============
const MENU=[
  {g:"Calculatoare", items:[{t:"Calculator de build-uri"},{t:"Calculator Metin"},{t:"Stat Calculator",soon:1}]},
  {g:"Costuri upgrade", items:[{t:"75lvl weapon",active:1},{t:"Armură 75",soon:1},{t:"Accesorii",soon:1},{t:"Amulete",soon:1}]},
  {g:"Materiale", items:[{t:"Toate materialele"},{t:"Prețurile mele"}]},
  {g:"Sisteme", items:[{t:"Hartă interactivă",soon:1},{t:"Bonusuri",soon:1},{t:"Alchimie",soon:1}]},
  {g:"Ghid", items:[{t:"Chapter I",soon:1},{t:"Chapter II",soon:1},{t:"PVP",soon:1}]},
  {g:"Rapoarte bot", items:[{t:"Statistici (privat)",soon:1}]},
];
const GEM='<svg class="gem" viewBox="0 0 32 32"><polygon points="16,3 29,16 16,29 3,16" fill="#e7b954"/><polygon points="16,3 29,16 16,16" fill="#f6d488"/></svg>';
function buildNav(filter=""){
  const nav=document.getElementById("nav"); nav.innerHTML="";
  MENU.forEach((grp,gi)=>{
    const matches=grp.items.filter(it=>!filter||it.t.toLowerCase().includes(filter));
    if(filter&&matches.length===0) return;
    const g=document.createElement("div"); g.className="grp"+((gi<2||filter)?" open":"");
    g.innerHTML=`<div class="grphead">${grp.g}<span class="chev">▶</span></div><div class="grpbody"></div>`;
    const body=g.querySelector(".grpbody");
    (filter?matches:grp.items).forEach(it=>{
      const el=document.createElement("div");
      el.className="navitem"+(it.active?" active":"");
      el.innerHTML=GEM+`<span>${it.t}</span>`+(it.soon?'<span class="soon">curând</span>':'');
      if(!it.soon) el.onclick=()=>{ if(it.t==="Toate materialele"||it.t==="Prețurile mele") renderMaterials(); else renderItem(); closeNav(); };
      body.appendChild(el);
    });
    g.querySelector(".grphead").onclick=()=>g.classList.toggle("open");
    nav.appendChild(g);
  });
}
document.getElementById("search").addEventListener("input",e=>buildNav(e.target.value.trim().toLowerCase()));
document.getElementById("toggle").onclick=()=>{ if(innerWidth<=900) document.body.classList.toggle("nav-open"); else document.body.classList.toggle("hid"); };
document.getElementById("scrim").onclick=closeNav;
function closeNav(){document.body.classList.remove("nav-open");}

// ============ prețuri per user (localStorage) ============
const PKEY="db_prices_v1";
function loadPrices(){ try{return JSON.parse(localStorage.getItem(PKEY))||{};}catch(e){return {};} }
function savePrices(p){ try{localStorage.setItem(PKEY,JSON.stringify(p));}catch(e){} }
let PRICES=loadPrices();
// prețuri "globale" demo (implicite) — folosite până pui tu ale tale
const GLOBAL={"Water Crystal":5e6,"Snake Tail":10e6,"Blue Crystal":300e3,"Fossil":10e6,
  "Pearl Fusion":1e6,"Spider Legs":8e6,"Finger Bones":6e6,"Dragon Claw":40e6,"Ruby":2e6,"Sapphire":2e6};
let useGlobal=false;
function priceOf(m){ if(useGlobal) return GLOBAL[m]||0; return (PRICES[m]!=null?PRICES[m]:(GLOBAL[m]||0)); }

// ============ item demo: 75lvl weapon ============
const ITEM={ name:"75lvl weapon", icon:"⚔️",
  levels:[ // +1..+9: taxa yang + materiale (demo; +4 e din poza reală)
    {tax:750e3,mats:[]},{tax:775e3,mats:[]},{tax:790e3,mats:[]},
    {tax:800e3,mats:[["Water Crystal",1],["Snake Tail",1]]},
    {tax:850e3,mats:[["Blue Crystal",2],["Snake Tail",2]]},
    {tax:900e3,mats:[["Blue Crystal",3],["Spider Legs",2]]},
    {tax:910e3,mats:[["Fossil",1],["Finger Bones",2]]},
    {tax:1200e6,mats:[["Pearl Fusion",2],["Dragon Claw",1]]},
    {tax:1500e6,mats:[["Dragon Claw",3],["Ruby",1]]},
  ],
  craft:{mats:[["Water Crystal",3],["Snake Tail",1]],tax:50e6} };

function fmt(n){ n=Number(n)||0; const a=Math.abs(n);
  if(a>=1e9) return trim(n/1e9)+"kkk"; if(a>=1e6) return trim(n/1e6)+"kk";
  if(a>=1e3) return trim(n/1e3)+"k"; return String(Math.round(n)); }
function trim(x){ return (Math.round(x*1000)/1000).toString(); }

function renderItem(){
  document.getElementById("crumbs").innerHTML="Acasă / <b>Chapter I</b> / Weapons / "+ITEM.name;
  const c=document.getElementById("content");
  // header
  let h=`<div class="ihead"><div class="ic" style="font-size:28px">${ITEM.icon}</div>
    <h2>${ITEM.name}</h2>
    <div class="toggle"><button id="tMy" class="${!useGlobal?'on':''}">Prețurile mele</button>
      <button id="tGl" class="${useGlobal?'on':''}">Prețuri globale</button></div></div>`;
  // tabel imbunatatire
  h+=`<div class="sect">Îmbunătățire</div><div class="tblwrap"><table><tr><th class="lbl">Nivel</th>`;
  ITEM.levels.forEach((_,i)=>h+=`<th>+${i+1}</th>`); h+=`</tr><tr><td class="lbl">Materiale</td>`;
  ITEM.levels.forEach(l=>{ h+=`<td>`+(l.mats.length?l.mats.map(m=>`<span class="matchip">${m[0]} <span class="q">×${m[1]}</span></span>`).join(""):"–")+`</td>`; });
  h+=`</tr><tr class="taxrow"><td class="lbl">Taxă</td>`;
  ITEM.levels.forEach(l=>h+=`<td>${fmt(l.tax)}</td>`); h+=`</tr></table></div>`;
  // confectionare
  h+=`<div class="sect">Confecționează</div><div class="craft">`+
     ITEM.craft.mats.map(m=>`<span class="matchip">${m[0]} <span class="q">×${m[1]}</span></span>`).join("")+
     `<span class="badge" style="margin-left:auto">taxă ${fmt(ITEM.craft.tax)} yang</span></div>`;
  // etape
  h+=`<div class="sect">Cost pe etape</div><div id="stages"></div>`;
  h+=`<div class="total"><span class="lbl">Cost total</span><span class="val" id="grand">0</span></div>`;
  h+=`<p class="note">💡 Prețurile se setează o singură dată în tab-ul <b style="color:var(--gold2)">Materiale → Prețurile mele</b> și se aplică automat la <b>toate</b> itemele. Aici sunt doar afișate. Se salvează în browserul tău și rămân data viitoare. (Materialele pe +5…+9 sunt exemplu — le punem exact din datele Baerim.)</p>`;
  c.innerHTML=h;
  document.getElementById("tMy").onclick=()=>{useGlobal=false;renderItem();};
  document.getElementById("tGl").onclick=()=>{useGlobal=true;renderItem();};
  renderStages();
}

function renderStages(){
  const wrap=document.getElementById("stages"); wrap.innerHTML="";
  ITEM.levels.forEach((l,i)=>{
    const st=document.createElement("div"); st.className="stage";
    let body=`<div class="matline taxline"><span class="nm">💰 Taxă în yang</span><span class="q"></span>
      <span class="price"><span class="tot">${fmt(l.tax)}</span></span></div>`;
    l.mats.forEach(m=>{
      const p=priceOf(m[0]);
      body+=`<div class="matline"><span class="nm">${m[0]}</span><span class="q">×${m[1]}</span>
        <span class="price"><span class="unit" data-unit="${m[0]}">${fmt(p)}/buc</span>
        <span class="tot" data-tot="${m[0]}">${fmt(p*m[1])}</span></span></div>`;
    });
    st.innerHTML=`<div class="stagehd"><span class="lv">+${i} → +${i+1}</span>
      <label><input type="checkbox" class="inc" data-i="${i}" checked> Include</label>
      <label>Sul <select><option>Fără sul</option><option>Sul benedicție</option></select></label>
      <label>Sigiliu <select><option>Fără sigiliu</option><option>Sigiliu</option></select></label>
      <span class="sub" data-sub="${i}">0</span></div>
      <div class="stbody">${body}</div>`;
    wrap.appendChild(st);
  });
  wrap.querySelectorAll(".inc").forEach(cb=>cb.addEventListener("change",()=>{
    cb.closest(".stage").classList.toggle("dim",!cb.checked); recompute(); }));
  recompute();
}
function recompute(){
  let grand=0;
  ITEM.levels.forEach((l,i)=>{
    const inc=document.querySelector(`.inc[data-i="${i}"]`).checked;
    let sub=l.tax;
    l.mats.forEach(m=>{ const t=priceOf(m[0])*m[1]; sub+=t;
      const el=document.querySelector(`.stage:nth-child(${i+1}) [data-tot="${CSS.escape(m[0])}"]`); if(el)el.textContent=fmt(priceOf(m[0])*m[1]); });
    document.querySelector(`[data-sub="${i}"]`).textContent=fmt(sub)+" yang";
    if(inc) grand+=sub;
  });
  document.getElementById("grand").textContent=fmt(grand)+" yang";
}

// ============ pagina Materiale ============
function renderMaterials(){
  document.getElementById("crumbs").innerHTML="Acasă / <b>Materiale</b>";
  const c=document.getElementById("content");
  const mats=Object.keys(GLOBAL);
  let h=`<div class="ihead"><div class="ic" style="font-size:26px">📦</div><h2>Materiale</h2>
    <div class="toggle"><button id="tMy" class="${!useGlobal?'on':''}">Prețurile mele</button>
      <button id="tGl" class="${useGlobal?'on':''}">Prețuri globale</button></div></div>
    <p class="note">Setează prețul fiecărui material — se salvează la tine și e folosit în toate calculatoarele.</p>
    <div class="tblwrap"><table><tr><th class="lbl">Material</th><th>Preț (yang)</th><th>Afișat</th></tr>`;
  mats.forEach(m=>{ const p=priceOf(m);
    h+=`<tr><td class="lbl">${m}</td><td><input data-mat="${m}" ${useGlobal?'disabled':''} value="${p}"
      style="width:140px;background:var(--bg2);border:1px solid var(--line2);color:var(--gold2);border-radius:7px;padding:5px 8px;text-align:right;font-family:'JetBrains Mono',monospace"></td>
      <td style="font-family:'JetBrains Mono',monospace;color:var(--mut)" data-show="${m}">${fmt(p)}</td></tr>`; });
  h+=`</table></div>`;
  c.innerHTML=h;
  document.getElementById("tMy").onclick=()=>{useGlobal=false;renderMaterials();};
  document.getElementById("tGl").onclick=()=>{useGlobal=true;renderMaterials();};
  c.querySelectorAll("input[data-mat]").forEach(inp=>inp.addEventListener("input",()=>{
    PRICES[inp.dataset.mat]=Number(inp.value)||0; savePrices(PRICES);
    c.querySelector(`[data-show="${CSS.escape(inp.dataset.mat)}"]`).textContent=fmt(Number(inp.value)||0); }));
}

function start(){ buildNav(); renderItem(); }
function showBetaLogin(){
  const g=document.getElementById("betaGate"); g.classList.add("show");
  const btn=document.getElementById("bbtn"), pw=document.getElementById("bpw"), err=document.getElementById("berr");
  async function go(){ err.textContent=""; btn.disabled=true; btn.textContent="Verific...";
    try{ const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})});
      if(r.ok){ g.classList.remove("show"); start(); return; }
      const j=await r.json().catch(()=>({})); err.textContent=(j.error==="unconfigured")?"Parola nu e setata in Cloudflare.":"Parola gresita.";
    }catch(e){ err.textContent="Eroare de retea."; }
    btn.disabled=false; btn.textContent="Intra"; }
  btn.onclick=go; pw.addEventListener("keydown",e=>{if(e.key==="Enter")go();}); pw.focus();
}
async function betaGate(){
  const real = location.hostname==="deliricbae.ro"||location.hostname==="www.deliricbae.ro"||location.hostname.endsWith("workers.dev");
  if(!real){ start(); return; }
  try{ const r=await fetch("/api/reports",{credentials:"same-origin"});
    if(r.ok){ start(); return; }
    if(r.status===401){ showBetaLogin(); return; }
    start();
  }catch(e){ start(); }
}
betaGate();
</script>
