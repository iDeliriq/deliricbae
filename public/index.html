*{box-sizing:border-box}
html,body{margin:0}
body{

a{color:var(--gold2)}
.wrap{max-width:1080px; margin:0 auto; padding:0 16px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:10px; font-family:"Cinzel",serif; font-weight:700; letter-spacing:.08em; color:var(--gold2); font-size:20px; text-decoration:none}

  color:var(--ink); border:1px solid var(--line2); border-radius:10px; padding:9px 30px 9px 12px; font:inherit; font-size:14px; cursor:pointer}
select:focus{outline:2px solid var(--gold); outline-offset:1px}
.btn{display:inline-block; padding:12px 22px; border-radius:10px; background:var(--gold); color:#1a1405;
  font-weight:600; text-decoration:none; border:0; cursor:pointer; font:inherit; font-weight:600}
.btn:hover{background:var(--gold2)}
.btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line2)}

.hero p{color:var(--mut); font-size:18px; max-width:640px; margin:0 auto 28px}
.cta{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
section{padding:48px 0}
h2{font-family:"Cinzel",serif; font-size:28px; margin:0 0 8px; text-align:center}
.lead{color:var(--mut); text-align:center; margin:0 auto 28px; max-width:640px}
.grid{display:grid; gap:20px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px}
.card h3{margin:0 0 4px; font-size:20px}
.card .tag{color:var(--gold); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase}
.card ul{padding-left:20px; margin:12px 0 0; color:var(--mut)}
.card li{margin:6px 0}
.card li b{color:var(--ink); font-weight:500}
.video{aspect-ratio:16/9; border-radius:12px; border:1px dashed var(--line2); display:grid; place-items:center;
  color:var(--dim); margin-top:16px; font-size:14px; background:var(--panel2)}
.period{display:flex; justify-content:center; margin:0 auto 24px}
.seg{display:inline-flex; background:var(--panel); border:1px solid var(--line2); border-radius:12px; padding:4px; gap:4px}
.seg button{background:transparent; color:var(--mut); border:0; border-radius:9px; padding:8px 16px; font:inherit; font-size:14px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold); color:#1a1405; font-weight:600}
.price{text-align:center}
.price .amt{font-size:40px; font-weight:600; color:var(--ink); margin:12px 0 0; font-variant-numeric:tabular-nums}
.price .per{color:var(--dim); font-size:14px; min-height:22px}
.price ul{text-align:left}
.price.best{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset}
.badge{display:inline-block; background:var(--gold); color:#1a1405; font-size:12px; font-weight:600; padding:2px 10px; border-radius:99px}
.price .btn{margin-top:20px; width:100%}
.steps{counter-reset:s; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.step{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px}
.step::before{counter-increment:s; content:counter(s); display:grid; place-items:center; width:32px; height:32px;
  border-radius:50%; background:var(--gold); color:#1a1405; font-weight:700; margin-bottom:10px}
.step p{margin:0; color:var(--mut)}
.step p b{color:var(--ink); font-weight:500}
.pay{display:grid; grid-template-columns:1fr auto; gap:28px; align-items:center; margin-top:20px}
.pay p{margin:6px 0 0; color:var(--mut)}
.pay p b{color:var(--gold2)}
.amounts{width:100%; border-collapse:collapse; margin:16px 0 8px; font-variant-numeric:tabular-nums}
.amounts th,.amounts td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:15px}
.amounts th{color:var(--dim); font-weight:500; font-size:13px}
.amounts td.v{color:var(--ink); font-weight:600}
.pay-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
.qr{background:#fff; border-radius:16px; padding:12px; width:220px; text-align:center}
.qr img{display:block; width:196px; height:196px}
.qr span{display:block; color:#0b1020; font-size:13px; font-weight:600; margin-top:4px}
.note{font-size:13px; color:var(--dim); margin-top:10px}
details{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:10px auto; max-width:760px}
summary{cursor:pointer; font-weight:500}
details p{color:var(--mut); margin:10px 0 0}
.warn{max-width:760px; margin:24px auto 0; font-size:14px; color:var(--mut); border-left:3px solid var(--bad); padding:8px 14px}
footer{padding:40px 0; text-align:center; color:var(--dim); font-size:13px; border-top:1px solid var(--line); margin-top:32px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (max-width:640px){
  .pay{grid-template-columns:1fr}
  .qr{margin:0 auto}
}
</style>

// ---- stare (limba, moneda, perioada), tinuta si intre vizite daca browserul permite ----
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function detectLang() {
  const saved = store("aurum_lang"); if (saved && T[saved]) return saved;
  const nav = (navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2).toLowerCase());
  return nav.find(l => T[l]) || "en";
}
let lang = detectLang();
let cur = store("aurum_cur") || LANG_CUR[lang] || "EUR";
if (!PRICES[cur]) cur = "EUR";
let period = 1;

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => {
    const v = t[el.dataset.i];
    if (v !== undefined) el.innerHTML = v;
  });
  const p = PRICES[cur], f = FMT[cur], i = period === 1 ? 0 : 1;
  document.querySelectorAll("[data-price]").forEach(el => { el.textContent = f(p[el.dataset.price][i]); });
  document.querySelectorAll("[data-per]").forEach(el => {
    let txt = t[period === 1 ? "per_1" : "per_3"];
    if (el.dataset.per === "bundle") {
      const save = p.farm[i] + p.fish[i] - p.bundle[i];
      if (save > 0) txt += " · " + t.save.replace("{v}", f(save));
    }
    el.textContent = txt;
  });
  document.querySelectorAll("[data-amt]").forEach(el => {
    const [k, per] = el.dataset.amt.split("-");
    el.textContent = f(p[k][per === "1" ? 0 : 1]);
  });
  document.querySelectorAll("[data-period]").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.period) === period)));
  document.getElementById("langSel").value = lang;
  document.getElementById("curSel").value = cur;
}

document.getElementById("langSel").addEventListener("change", e => {
  lang = e.target.value; store("aurum_lang", lang);
  // moneda urmeaza limba, cat timp vizitatorul nu a ales-o el explicit
  if (!store("aurum_cur_manual")) cur = LANG_CUR[lang] || "EUR";
  render();
});
document.getElementById("curSel").addEventListener("change", e => {
  cur = e.target.value; store("aurum_cur", cur); store("aurum_cur_manual", "1"); render();
});
document.querySelectorAll("[data-period]").forEach(b => b.addEventListener("click", () => { period = Number(b.dataset.period); render(); }));
render();
</script>
</body>
