<title>deliricbae</title>
<meta name="description" content="Panou privat pentru botul Baerim — rapoarte pe zile și sesiuni.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0c110e; --bg2:#0f1712;
  --panel:#131e18; --panel2:#182720; --panel3:#1e3229;
  --line:#233529; --line2:#31493c;
  --ink:#e9f2ec; --mut:#8ca79b; --dim:#607a6e;
  --acc:#5ad1a0; --acc2:#7ee6bb; --accd:#2f8f6a;
  --cal:#ef6360; --wra:#f0b23e; --glo:#a88cff; --emb:#ff9a4d;
  --ok:#57d69a; --warn:#e6b24c; --bad:#e2665f;
  --sbw:240px;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 30px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Manrope",system-ui,sans-serif; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc);text-decoration:none}

/* ---------- shell ---------- */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:var(--sbw); z-index:40;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-right:1px solid var(--line); padding:18px 14px;
  display:flex; flex-direction:column; gap:6px; transition:transform .22s ease;
}
.sbrand{display:flex; align-items:center; gap:11px; padding:4px 6px 16px}
.sbrand h1{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:22px;
  margin:0;letter-spacing:.4px;line-height:1}
.sbrand h1 b{color:var(--acc)}
.sbrand .sub{color:var(--dim);font-size:10.5px;letter-spacing:.4px;margin-top:3px}
.navlbl{color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:10px 8px 4px}
.navitem{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;
  color:var(--mut);cursor:pointer;font-size:14px;font-weight:500;border:1px solid transparent;
  user-select:none}
.navitem:hover{background:var(--panel3);color:var(--ink)}
.navitem.active{background:color-mix(in srgb,var(--acc) 15%,transparent);
  color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.navitem .ic{width:18px;height:18px;flex:none;opacity:.9}
.navitem .lock{margin-left:auto;font-size:11px;opacity:.7}
.navitem.soon{opacity:.5;cursor:default}
.navitem.soon:hover{background:transparent;color:var(--mut)}
.navitem .tag{margin-left:auto;font-size:9px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.sbfoot{margin-top:auto;padding:8px 8px 0;color:var(--dim);font-size:11px;
  border-top:1px solid var(--line)}
.sbfoot .out{color:var(--mut);cursor:pointer;display:none}
.sbfoot .out:hover{color:var(--bad)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;opacity:0;
  pointer-events:none;transition:opacity .2s}
.main{margin-left:var(--sbw);min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 22px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel2);color:var(--ink);cursor:pointer;align-items:center;justify-content:center}
.burger svg{width:18px;height:18px}
.topbar .ttl{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:16px;letter-spacing:.4px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.badge{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--warn);
  border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);
  background:color-mix(in srgb,var(--warn) 12%,transparent);padding:4px 9px;border-radius:999px}
.content{padding:22px}
.section{display:none}
.section.on{display:block}

/* ---------- login ---------- */
.login{max-width:360px;margin:8vh auto 0;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow)}
.login .gem{display:block;margin:0 auto 14px}
.login h2{font-family:"Chakra Petch",sans-serif;font-weight:600;text-align:center;
  margin:0 0 4px;font-size:18px}
.login p{color:var(--mut);text-align:center;font-size:13px;margin:0 0 18px}
.login label{display:block;font-size:12px;color:var(--dim);margin:0 0 6px;letter-spacing:.3px}
.login input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--ink);font-size:14px;font-family:inherit}
.login input:focus{outline:2px solid color-mix(in srgb,var(--acc) 55%,transparent);
  outline-offset:1px;border-color:var(--acc)}
.login button{width:100%;margin-top:14px;padding:11px;border-radius:10px;border:0;
  background:var(--acc);color:#06130d;font-weight:700;font-size:14px;cursor:pointer;
  font-family:"Chakra Petch",sans-serif;letter-spacing:.3px}
.login button:hover{background:var(--acc2)}
.login button:disabled{opacity:.6;cursor:default}
.login .err{color:var(--bad);font-size:12.5px;text-align:center;margin-top:12px;min-height:16px}

/* ---------- kpi + panels (rapoarte) ---------- */
.wrapR{max-width:1060px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.kpi .val{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:26px;
  line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .val.acc{color:var(--acc)}
.kpi .foot{font-size:11.5px;color:var(--mut);margin-top:3px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:18px 18px 14px;box-shadow:var(--shadow)}
.panel h3{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.5px;margin:0 0 2px;text-transform:uppercase}
.panel .note{color:var(--dim);font-size:12px;margin:0 0 12px}
.chartwrap{overflow-x:auto}
svg{display:block}
.axislbl{fill:var(--dim);font-family:"JetBrains Mono",monospace;font-size:10px}
.typebar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 14px;background:var(--panel3)}
.typebar span{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:9px}
.legrow{display:flex;align-items:center;gap:10px;font-size:13px}
.legrow .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legrow .nm{color:var(--mut)}
.legrow .n{margin-left:auto;font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.legrow .pct{color:var(--dim);font-size:11.5px;width:42px;text-align:right;font-family:"JetBrains Mono",monospace}
.dayhead{display:flex;align-items:baseline;gap:12px;margin:26px 2px 12px}
.dayhead .d{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:17px}
.dayhead .wd{color:var(--dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
.dayhead .tot{margin-left:auto;display:flex;gap:16px;align-items:baseline}
.dayhead .tot b{font-family:"Chakra Petch",sans-serif;color:var(--acc);font-size:17px;font-variant-numeric:tabular-nums}
.dayhead .tot span{color:var(--mut);font-size:12px}
.hr{height:1px;background:linear-gradient(90deg,var(--line2),transparent);margin:0 2px}
.sessions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ses{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:14px 15px;position:relative;overflow:hidden}
.ses::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.85}
.ses .shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ses .time{font-family:"JetBrains Mono",monospace;font-size:13px}
.ses .dur{color:var(--mut);font-size:12px}
.ses .big{margin-left:auto;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:22px;
  color:var(--acc);font-variant-numeric:tabular-nums}
.ses .lr{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-bottom:10px;font-variant-numeric:tabular-nums}
.ses .lr b{color:var(--ink);font-family:"JetBrains Mono",monospace}
.mini{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--panel3);margin-bottom:11px}
.mini span{height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-family:"JetBrains Mono",monospace;color:var(--mut);
  background:var(--panel3);border:1px solid var(--line);border-radius:7px;padding:3px 8px;
  display:flex;align-items:center;gap:5px}
.chip b{color:var(--ink)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.chip.rate{color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 30%,transparent)}
.placeholder{color:var(--mut);max-width:520px;line-height:1.7;margin-top:8vh;
  text-align:center;margin-left:auto;margin-right:auto}
.placeholder .big{font-family:"Chakra Petch",sans-serif;font-size:20px;color:var(--ink);margin-bottom:8px}

@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .main{margin-left:0}
  .burger{display:inline-flex}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .sessions{grid-template-columns:1fr}
}
</style>

<aside class="sidebar" id="sidebar">
  <div class="sbrand">
    <svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true">
      <polygon points="17,2 32,17 17,32 2,17" fill="#1a2a23"/>
      <polygon points="17,2 32,17 17,17" fill="#7ee6bb"/>
      <polygon points="2,17 17,32 17,17" fill="#2f8f6a"/>
      <polygon points="17,2 17,17 2,17" fill="#5ad1a0"/>
      <polygon points="17,17 32,17 17,32" fill="#43b98a"/>
      <polygon points="17,2 32,17 17,32 2,17" fill="none" stroke="#0c110e" stroke-width="1.4"/>
    </svg>
    <div><h1>deliric<b>bae</b></h1><div class="sub">Baerim · panou</div></div>
  </div>
  <div class="navlbl">Meniu</div>
  <nav id="nav"></nav>
  <div class="sbfoot">
    <div class="out" id="logout">↩ Deconectare</div>
    <div style="padding-top:8px">© deliricbae</div>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar">
    <button class="burger" id="burger" aria-label="Meniu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="ttl" id="pageTitle">Rapoarte</span>
    <div class="right"><span class="badge" id="demoBadge" hidden>date demo</span></div>
  </div>
  <div class="content">
    <section class="section on" id="sec-rapoarte"></section>
    <section class="section" id="sec-setari">
      <div class="placeholder">
        <div class="big">Setări</div>
        Aici punem mai târziu opțiuni (ex. profil, preferințe). Loc rezervat.
      </div>
    </section>
  </div>
</div>

<script>
// ============ meniu (extensibil — adaugi un obiect aici) ============
const MENU=[
  {id:"rapoarte", label:"Rapoarte", locked:true, icon:'<path d="M4 4h16v16H4z" opacity=".0"/><path d="M7 14v3M12 9v8M17 12v5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>'},
  {id:"setari",   label:"Setări",   icon:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2"/>'},
  // exemplu de intrare viitoare (deblochezi ștergând "soon:true"):
  {id:"live", label:"Live", soon:true, icon:'<circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2" fill="none"/>'},
];

// ---- mediu: pe artifact/preview arătăm demo; pe deliricbae.ro folosim /api ----
const PREVIEW = !(location.hostname==="deliricbae.ro" || location.hostname==="www.deliricbae.ro"
                  || location.hostname.endsWith("workers.dev"));

const TYPES=[["Calamity","var(--cal)"],["Wrath","var(--wra)"],["Gloom","var(--glo)"],["Ember","var(--emb)"]];
const DEMO={
  daily:[{d:"31.08",k:640},{d:"01.09",k:912},{d:"02.09",k:0},{d:"03.09",k:1180},
    {d:"04.09",k:1044},{d:"05.09",k:760},{d:"06.09",k:1320},{d:"07.09",k:1190},
    {d:"08.09",k:1190},{d:"09.09",k:903}],
  allTime:41316,
  days:[
    {date:"09.09.2026",wd:"Marți",sessions:[
      {t:"20:41",dur:78,L:150,R:111,types:[150,80,24,7],aura:3,berserk:2,mg:[12,0,1]},
      {t:"22:10",dur:205,L:360,R:282,types:[360,190,70,22],aura:8,berserk:6,mg:[33,1,2]}]},
    {date:"08.09.2026",wd:"Luni",sessions:[
      {t:"19:02",dur:320,L:520,R:460,types:[520,300,120,40],aura:12,berserk:10,mg:[40,2,1]},
      {t:"23:48",dur:70,L:118,R:92,types:[118,66,20,6],aura:2,berserk:2,mg:[9,0,1]}]},
    {date:"07.09.2026",wd:"Duminică",sessions:[
      {t:"18:15",dur:410,L:640,R:540,types:[640,360,140,50],aura:15,berserk:13,mg:[52,3,2]},
      {t:"01:20",dur:95,L:150,R:110,types:[150,72,30,8],aura:3,berserk:3,mg:[11,1,0]}]},
  ]};

const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=n=>Number(n).toLocaleString("ro-RO");
const hm=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`;
const $=s=>document.querySelector(s);

// ============ meniu render + rutare ============
let current="rapoarte";
function buildNav(){
  const nav=$("#nav"); nav.innerHTML="";
  MENU.forEach(m=>{
    const el=document.createElement("div");
    el.className="navitem"+(m.soon?" soon":"")+(m.id===current?" active":"");
    el.innerHTML=`<svg class="ic" viewBox="0 0 24 24">${m.icon}</svg><span>${m.label}</span>`+
      (m.locked?'<span class="lock">🔒</span>':(m.soon?'<span class="tag">curând</span>':''));
    if(!m.soon) el.onclick=()=>{go(m.id); closeNav();};
    nav.appendChild(el);
  });
}
function go(id){
  current=id;
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("on"));
  const sec=$("#sec-"+id); if(sec) sec.classList.add("on");
  const m=MENU.find(x=>x.id===id);
  $("#pageTitle").textContent=m?m.label:"";
  buildNav();
  if(id==="rapoarte") openReports();
}
function closeNav(){document.body.classList.remove("nav-open");}
$("#burger").onclick=()=>document.body.classList.toggle("nav-open");
$("#scrim").onclick=closeNav;

// ============ rapoarte: login + randare ============
async function openReports(){
  const box=$("#sec-rapoarte");
  if(PREVIEW){ // preview: arătăm ecranul de login, orice parolă -> date demo
    $("#demoBadge").hidden=false;
    showLogin(box);
    return;
  }
  // site real: verificăm sesiunea
  let data=null;
  try{
    const r=await fetch("/api/reports",{credentials:"same-origin"});
    if(r.ok){ data=await r.json(); }
    else if(r.status!==401){ throw new Error("server"); }
  }catch(e){ box.innerHTML=`<div class="placeholder"><div class="big">Eroare</div>Nu am putut lua datele. Reîncearcă.</div>`; return; }
  if(data){ $("#logout").style.display="block"; renderReports(box, data); }
  else { showLogin(box); }
}

function showLogin(box){
  $("#logout").style.display="none";
  box.innerHTML=`
    <div class="login">
      <svg class="gem" width="40" height="40" viewBox="0 0 34 34">
        <polygon points="17,2 32,17 17,32 2,17" fill="#1a2a23"/>
        <polygon points="17,2 32,17 17,17" fill="#7ee6bb"/>
        <polygon points="2,17 17,32 17,17" fill="#2f8f6a"/>
        <polygon points="17,2 17,17 2,17" fill="#5ad1a0"/>
        <polygon points="17,17 32,17 17,32" fill="#43b98a"/></svg>
      <h2>Rapoarte private</h2>
      <p>Introdu parola ca să vezi statisticile.</p>
      <label for="pw">Parolă</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button id="loginBtn">Intră</button>
      <div class="err" id="loginErr">${PREVIEW?'<span style="color:var(--dim)">Previzualizare — orice parolă merge aici.</span>':''}</div>
    </div>`;
  const btn=$("#loginBtn"), pw=$("#pw"), err=$("#loginErr");
  async function doLogin(){
    if(PREVIEW){ $("#logout").style.display="block"; renderReports(box, DEMO); return; }
    err.textContent=""; btn.disabled=true; btn.textContent="Verific...";
    try{
      const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw.value})});
      if(r.ok){ openReports(); return; }
      const j=await r.json().catch(()=>({}));
      err.textContent = j.error==="unconfigured"
        ? "Parola nu e setată încă în Cloudflare (secret SITE_PASSWORD)."
        : "Parolă greșită.";
    }catch(e){ err.textContent="Eroare de rețea. Reîncearcă."; }
    btn.disabled=false; btn.textContent="Intră";
  }
  btn.onclick=doLogin;
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
}

$("#logout").onclick=async()=>{
  try{ await fetch("/api/logout",{method:"POST",credentials:"same-origin"}); }catch(e){}
  openReports();
};

// ============ desenarea raportului ============
function renderReports(box, D){
  box.innerHTML=`<div class="wrapR">
    <section class="kpis" id="kpis"></section>
    <section class="grid2">
      <div class="panel"><h3>Metine pe zi</h3><p class="note">ultimele 10 zile · azi evidențiat</p>
        <div class="chartwrap"><svg id="daychart" width="640" height="200"></svg></div></div>
      <div class="panel"><h3>Pe tip de metin</h3><p class="note">total, toate sesiunile</p>
        <div class="typebar" id="typebar"></div><div class="legend" id="typelegend"></div></div>
    </section>
    <section id="days"></section></div>`;

  let allK=0,allM=0,sc=0,mgOk=0,mgTot=0;
  D.days.forEach(d=>d.sessions.forEach(s=>{allK+=s.L+s.R;allM+=s.dur;sc++;mgOk+=s.mg[0];mgTot+=s.mg[0]+s.mg[1]+s.mg[2];}));
  const rate=allM?Math.round(allK/(allM/60)):0;
  const succ=mgTot?Math.round(mgOk/mgTot*100):0;
  const kpis=[
    {lbl:"Total dintotdeauna",val:fmt(D.allTime),acc:1,foot:"metine sparte"},
    {lbl:"Ore farmate",val:(allM/60).toFixed(1)+"h",foot:`${sc} sesiuni`},
    {lbl:"Ritm mediu",val:fmt(rate),foot:"metine / oră"},
    {lbl:"Mini-game",val:succ+"%",acc:1,foot:`${mgOk}/${mgTot} rezolvate`},
    {lbl:"Ultimele zile",val:fmt(allK),foot:"metine"},
  ];
  $("#kpis").innerHTML=kpis.map(k=>`<div class="kpi"><div class="lbl">${k.lbl}</div>
    <div class="val ${k.acc?"acc":""}">${k.val}</div><div class="foot">${k.foot}</div></div>`).join("");

  // bar chart
  (function(){
    const W=640,H=200,pT=16,pB=26,pL=34,pR=8;
    const mx=Math.max(...D.daily.map(d=>d.k),1), nm=Math.ceil(mx/200)*200||200;
    const iw=W-pL-pR, ih=H-pT-pB, n=D.daily.length, gap=iw/n, bw=gap*0.62;
    let g=`<line x1="${pL}" y1="${pT+ih}" x2="${W-pR}" y2="${pT+ih}" stroke="var(--line2)"/>`;
    [0,.5,1].forEach(f=>{const y=pT+ih-ih*f;
      g+=`<line x1="${pL}" y1="${y}" x2="${W-pR}" y2="${y}" stroke="var(--line)" stroke-dasharray="2 4"/>`;
      g+=`<text class="axislbl" x="${pL-7}" y="${y+3}" text-anchor="end">${Math.round(nm*f)}</text>`;});
    D.daily.forEach((d,i)=>{const x=pL+gap*i+(gap-bw)/2,h=d.k/nm*ih,y=pT+ih-h,today=i===D.daily.length-1;
      if(d.k>0) g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${today?'var(--acc)':'var(--accd)'}"/>`;
      g+=`<text class="axislbl" x="${(x+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle" ${today?'fill="var(--acc)"':''}>${d.d}</text>`;});
    $("#daychart").innerHTML=g;
  })();

  // type breakdown
  (function(){
    const tot=[0,0,0,0]; D.days.forEach(d=>d.sessions.forEach(s=>s.types.forEach((v,i)=>tot[i]+=v)));
    const T=sum(tot)||1;
    $("#typebar").innerHTML=tot.map((v,i)=>`<span style="width:${v/T*100}%;background:${TYPES[i][1]}"></span>`).join("");
    $("#typelegend").innerHTML=TYPES.map((t,i)=>`<div class="legrow"><span class="sw" style="background:${t[1]}"></span>
      <span class="nm">${t[0]}</span><span class="n">${fmt(tot[i])}</span><span class="pct">${Math.round(tot[i]/T*100)}%</span></div>`).join("");
  })();

  // days + sessions
  $("#days").innerHTML=D.days.map(d=>{
    const dk=sum(d.sessions.map(s=>s.L+s.R)), dm=sum(d.sessions.map(s=>s.dur));
    const cards=d.sessions.map(s=>{
      const tot=s.L+s.R,T=sum(s.types)||1;
      const mini=s.types.map((v,i)=>`<span style="width:${v/T*100}%;background:${TYPES[i][1]}"></span>`).join("");
      const r=Math.round(tot/(s.dur/60)), mgt=s.mg[0]+s.mg[1]+s.mg[2];
      return `<div class="ses"><div class="shead"><span class="time">${s.t}</span><span class="dur">· ${hm(s.dur)}</span>
        <span class="big">${fmt(tot)}</span></div>
        <div class="lr"><span>Stânga <b>${s.L}</b></span><span>Dreapta <b>${s.R}</b></span></div>
        <div class="mini">${mini}</div>
        <div class="chips"><span class="chip rate">${r} <b>/h</b></span>
          <span class="chip">Aura <b>${s.aura}</b></span><span class="chip">Berserk <b>${s.berserk}</b></span>
          <span class="chip ok">MG <b>${s.mg[0]}/${mgt}</b></span></div></div>`;
    }).join("");
    return `<div class="dayhead"><span class="d">${d.date}</span><span class="wd">${d.wd}</span>
      <span class="tot"><span>${d.sessions.length} sesiuni · ${hm(dm)}</span><b>${fmt(dk)}</b></span></div>
      <div class="hr"></div><div class="sessions">${cards}</div>`;
  }).join("");
}

buildNav(); go("rapoarte");
</script>
