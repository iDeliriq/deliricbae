<meta charset="utf-8">
<title>deliricbae unelte</title>
<meta name="description" content="Unelte Baerim — calculatoare de upgrade și prețuri, editabile de admin.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#080b16; --bg2:#0b1020; --panel:#111a30; --panel2:#152037; --panel3:#1b2947;
  --line:#243256; --line2:#33456f;
  --ink:#eaeefb; --mut:#9aa6c8; --dim:#5f6c93;
  --gold:#e7b954; --gold2:#f6d488; --goldd:#a9812c;
  --ok:#5fd39a; --bad:#e2685f;
  --sbw:250px;
  --shadow:0 14px 34px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font-family:"Poppins",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 78% -10%,rgba(231,185,84,.10),transparent 60%),
    radial-gradient(900px 500px at 8% 6%,rgba(90,120,255,.08),transparent 55%),var(--bg);}
.stars{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 60% 70%,#cdd6ff,transparent),
    radial-gradient(1px 1px at 80% 20%,#fff,transparent),radial-gradient(1px 1px at 35% 80%,#e7d6a0,transparent),
    radial-gradient(1px 1px at 90% 55%,#fff,transparent),radial-gradient(2px 2px at 48% 18%,#fff,transparent);
  background-repeat:repeat;background-size:520px 520px;}
a{color:var(--gold2);text-decoration:none}

.sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);z-index:40;
  background:linear-gradient(180deg,rgba(17,26,48,.96),rgba(11,16,32,.98));
  border-right:1px solid var(--line);display:flex;flex-direction:column;transition:transform .22s ease}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand h1{font-family:"Cinzel",serif;font-weight:700;font-size:19px;margin:0;letter-spacing:1px;
  background:linear-gradient(180deg,var(--gold2),var(--goldd));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.brand .sub{color:var(--dim);font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.sbsearch{padding:0 14px 10px}
.sbsearch input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:13px;font-family:inherit}
.sbsearch input:focus{outline:2px solid rgba(231,185,84,.4);border-color:var(--gold)}
.nav{flex:1;overflow:auto;padding:4px 8px 10px}
.secgrp{margin-bottom:3px}
.secgrphead{display:flex;align-items:center;gap:9px;padding:10px 10px;border-radius:9px;cursor:pointer;
  color:var(--gold2);font-family:"Cinzel",serif;font-size:12.5px;letter-spacing:.6px;user-select:none}
.secgrphead:hover{background:var(--panel2)}
.secgrphead .chev{margin-left:auto;transition:transform .18s;font-size:10px;color:var(--dim)}
.secgrp.open>.secgrphead .chev{transform:rotate(90deg)}
.secgrpbody{display:none;padding:2px 0 6px 6px}
.secgrp.open>.secgrpbody{display:block}
.grp{margin-bottom:1px}
.grphead{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;
  color:var(--mut);font-size:11.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;user-select:none}
.grphead:hover{background:var(--panel2);color:var(--ink)}
.grphead .chev{margin-left:auto;transition:transform .18s;font-size:9px;color:var(--dim)}
.grp.open>.grphead .chev{transform:rotate(90deg)}
.grpbody{display:none;padding:1px 0 4px 8px}
.grp.open>.grpbody{display:block}
.navitem{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px;user-select:none}
.navitem:hover{background:var(--panel2);color:var(--ink)}
.navitem.active{color:var(--gold2);background:rgba(231,185,84,.10)}
.navitem img{width:18px;height:18px;flex:none;border-radius:4px;background:var(--bg2)}
.navitem .dot{width:7px;height:7px;border-radius:2px;background:var(--line2);flex:none;transform:rotate(45deg)}
.navitem .empty{color:var(--dim);font-style:italic}
.sbfoot{padding:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sbfoot .navitem{font-size:12.5px}
.sbfoot .adm{color:var(--gold2)}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.main{margin-left:var(--sbw);min-height:100vh}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;background:rgba(8,11,22,.85);backdrop-filter:blur(6px)}
.iconbtn{width:36px;height:36px;border:1px solid var(--line2);border-radius:9px;background:var(--panel2);color:var(--ink);cursor:pointer;display:none;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px}
.crumbs{color:var(--dim);font-size:13px}
.crumbs b{color:var(--gold2);font-weight:600}
.content{padding:20px;max-width:1000px}

.ihead{display:flex;align-items:center;gap:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.ihead .ic{width:56px;height:56px;flex:none;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px}
.ihead .ic img{width:48px;height:48px}
.ihead h2{font-family:"Cinzel",serif;margin:0;font-size:22px;letter-spacing:.5px}
.ihead .desc{color:var(--mut);font-size:13px;margin-top:2px}

.sect{font-family:"Cinzel",serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2);margin:22px 2px 10px}

/* matrice upgrade vizuala */
.matrixwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table.matrix{border-collapse:collapse;width:100%;min-width:640px}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:7px 5px;text-align:center;vertical-align:middle}
table.matrix th{color:var(--gold2);font-family:"JetBrains Mono",monospace;background:var(--panel2);font-size:12px}
table.matrix td.mlbl,table.matrix th.mlbl{text-align:left;color:var(--mut);font-family:"Cinzel",serif;font-size:10.5px;
  letter-spacing:1px;text-transform:uppercase;background:var(--panel2);white-space:nowrap;position:sticky;left:0}
.mcell{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.micon{width:36px;height:36px;border-radius:7px;background:var(--bg2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:12px;color:var(--dim)}
.micon img{width:32px;height:32px}
.mcell .q{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--gold2)}
.matrix .dash{color:var(--dim)}
tr.pret td{font-family:"JetBrains Mono",monospace;color:var(--gold2);font-weight:600;font-size:12px}
tr.chance td{font-family:"JetBrains Mono",monospace;color:var(--ok);font-size:11px}
.total{display:flex;align-items:baseline;gap:12px;justify-content:flex-end;margin-top:14px;font-family:"Cinzel",serif;font-size:20px}
.total b{color:var(--gold2);font-family:"JetBrains Mono",monospace}

.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--mut)} .dim{color:var(--dim)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
table.simple{border-collapse:collapse;width:100%;min-width:480px}
table.simple th,table.simple td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line);font-size:12.5px}
table.simple th{color:var(--gold2);font-family:"JetBrains Mono",monospace;background:var(--panel2)}
table.simple td.lbl,table.simple th.lbl{text-align:left;color:var(--mut)}
.num{font-family:"JetBrains Mono",monospace}
.matchip{display:inline-flex;align-items:center;gap:4px;background:var(--panel3);border:1px solid var(--line2);border-radius:7px;padding:2px 7px;margin:2px;font-size:11px}
.matchip .q{color:var(--gold2);font-family:"JetBrains Mono",monospace}

input,select,textarea{font-family:inherit}
.inp{padding:8px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);font-size:13px}
.inp:focus{outline:2px solid rgba(231,185,84,.35);border-color:var(--gold)}
.num.inp{font-family:"JetBrains Mono",monospace}
.btn{border:0;border-radius:9px;padding:9px 14px;cursor:pointer;font-family:"Cinzel",serif;font-size:13px;letter-spacing:.4px;background:linear-gradient(180deg,var(--gold),var(--goldd));color:#1a1204;font-weight:700}
.btn:hover{background:linear-gradient(180deg,var(--gold2),var(--gold))}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);font-weight:600}
.btn.ghost:hover{border-color:var(--gold)}
.btn.sm{padding:5px 9px;font-size:12px;font-family:"Poppins",sans-serif}
.btn.danger{background:var(--panel2);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.login{max-width:360px;margin:8vh auto 0}
.login .card h2{font-family:"Cinzel",serif;text-align:center;margin:0 0 4px;font-size:18px}
.login p{color:var(--mut);text-align:center;font-size:13px;margin:0 0 16px}
.login .err{color:var(--bad);font-size:12.5px;text-align:center;margin-top:10px;min-height:16px}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--mut);cursor:pointer;font-size:13px;font-weight:600}
.tab.on{background:rgba(231,185,84,.12);color:var(--gold2);border-color:color-mix(in srgb,var(--gold) 40%,transparent)}
.erow{display:grid;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px}
.erow.sec{grid-template-columns:1fr 90px 40px}
.erow.cat{grid-template-columns:1fr 150px 90px 40px}
.erow.mat{grid-template-columns:38px 1fr 150px 110px 36px}
/* icon picker */
.imodal{position:fixed;inset:0;z-index:80;background:rgba(4,6,14,.72);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px}
.imodal.on{display:flex}
.ibox{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(720px,100%);max-height:82vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ihd{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.ihd h3{font-family:"Cinzel",serif;margin:0;font-size:15px;color:var(--gold2);flex:none}
.ihd input{flex:1}
.igrid{overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.igrid .ic{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);cursor:pointer;text-align:center}
.igrid .ic:hover{border-color:var(--gold);background:var(--panel2)}
.igrid .ic img{width:36px;height:36px}
.igrid .ic .nm{font-size:9.5px;color:var(--mut);line-height:1.15;max-height:24px;overflow:hidden}
.igrid .ic .vn{font-size:9px;color:var(--dim);font-family:"JetBrains Mono",monospace}
.ifoot{padding:8px 14px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between;align-items:center}
.itemcard{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:10px;overflow:hidden}
.itemhd{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel2);cursor:pointer}
.itemhd .nm{font-weight:600}
.itemhd .chev{margin-left:auto;color:var(--dim);transition:transform .18s}
.itemcard.open .itemhd .chev{transform:rotate(90deg)}
.itembody{display:none;padding:12px;border-top:1px solid var(--line)}
.itemcard.open .itembody{display:block}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:11px;color:var(--dim);letter-spacing:.4px;text-transform:uppercase}
.grid2f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lvrow{display:grid;grid-template-columns:56px 110px 70px 1fr 34px;gap:8px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--bg2)}
.lvrow .mats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lvmat{display:flex;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:3px 5px}
.lvmat select{max-width:150px}
.savebar{position:sticky;bottom:0;margin-top:16px;padding:12px;border-top:1px solid var(--line);
  background:rgba(8,11,22,.92);backdrop-filter:blur(6px);display:flex;align-items:center;gap:10px;justify-content:flex-end;border-radius:0 0 14px 14px;flex-wrap:wrap}
.savebar .st{margin-right:auto;font-size:12.5px;color:var(--mut)}
.iconprev{width:34px;height:34px;border-radius:7px;background:var(--bg2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.iconprev img{width:30px;height:30px}
.editbtn{margin-left:auto}
.placeholder{color:var(--mut);max-width:560px;line-height:1.7;margin:8vh auto 0;text-align:center}
.placeholder .big{font-family:"Cinzel",serif;font-size:20px;color:var(--ink);margin-bottom:8px}

@media (max-width:860px){
  .sidebar{transform:translateX(-100%)}
  body.nav-open .sidebar{transform:translateX(0)}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .main{margin-left:0}
  .iconbtn{display:inline-flex}
  .grid2f{grid-template-columns:1fr}
  .lvrow{grid-template-columns:1fr 1fr}
}

/* mokoko */
.mkwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.mklist{width:210px;flex:none;max-height:74vh;overflow:auto}
.mkgrp{font-family:"Cinzel",serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold2);margin:12px 4px 4px}
.mkmap{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px;user-select:none}
.mkmap:hover{background:var(--panel2);color:var(--ink)}
.mkmap.on{background:rgba(231,185,84,.12);color:var(--gold2)}
.mkmap .c{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--dim)}
.mkright{flex:1;min-width:280px}
.mkbar{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.mkbar .cnt{font-family:"Cinzel",serif;color:var(--gold2);font-size:16px}
.mkbar label{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
.mkboard{position:relative;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#0b1020;max-width:620px;margin:0 auto}
.mkboard img{display:block;width:100%;height:auto}
.mkpt{position:absolute;width:15px;height:15px;transform:translate(-50%,-50%);border-radius:50%;
  background:rgba(231,185,84,.92);border:2px solid #1a1204;cursor:pointer;box-shadow:0 0 0 2px rgba(0,0,0,.45);transition:width .1s,height .1s,background .1s}
.mkpt:hover{width:21px;height:21px;background:var(--gold2);z-index:4}
.mkpt.done{background:rgba(95,211,154,.45);border-color:#0b3a26;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.mktip{position:absolute;transform:translate(-50%,-150%);background:#0b1020;border:1px solid var(--gold);
  color:var(--gold2);font-family:"JetBrains Mono",monospace;font-size:12px;padding:3px 8px;border-radius:6px;
  white-space:nowrap;pointer-events:none;z-index:6}
</style>

<div class="stars"></div>
<div class="imodal" id="iconModal"><div class="ibox">
  <div class="ihd"><h3>Alege iconiță</h3><input class="inp" id="iconSearch" placeholder="Caută după nume sau vnum…" autocomplete="off"><button class="btn ghost sm" onclick="closeIconModal()">Închide</button></div>
  <div class="igrid" id="iconGrid"></div>
  <div class="ifoot"><span id="iconCount"></span><span>bază m2icondb (~4250 iconițe)</span></div>
</div></div>
<aside class="sidebar" id="sidebar">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 34 34"><polygon points="17,2 32,17 17,32 2,17" fill="#171f38"/>
      <polygon points="17,2 32,17 17,17" fill="#f6d488"/><polygon points="2,17 17,32 17,17" fill="#a9812c"/>
      <polygon points="17,2 17,17 2,17" fill="#e7b954"/><polygon points="17,17 32,17 17,32" fill="#c99a3a"/></svg>
    <div><h1>deliricbae</h1><div class="sub">Unelte Baerim</div></div>
  </div>

    <div class="navitem" onclick="location.href='/'"><span class="dot"></span> ← Înapoi la site</div>

  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="main">
  <div class="topbar">
    <button class="iconbtn" id="burger" aria-label="Meniu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="crumbs" id="crumbs">Unelte</div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const PREVIEW=!(location.hostname==="deliricbae.ro"||location.hostname==="www.deliricbae.ro"||location.hostname.endsWith("workers.dev"));
const PKEY="db_prices_v1";

const kk=n=>{n=Number(n)||0;const s=n<0?"-":"";n=Math.abs(n);
  const f=(v,d)=>{let x=v.toFixed(d);if(x.indexOf(".")>=0)x=x.replace(/0+$/,"").replace(/\.$/,"");return x;};
  if(n>=1e9)return s+f(n/1e9,2)+" kkk"; if(n>=1e6)return s+f(n/1e6,2)+" kk";
  if(n>=1e3)return s+Math.round(n/1e3)+" k"; return s+Math.round(n);};
const fmt=n=>Number(n||0).toLocaleString("ro-RO");
const uid=p=>p+"_"+Math.random().toString(36).slice(2,8);
const iconURL=v=>v?`https://img.m2icondb.com/${String(v).padStart(5,"0")}.png`:"";

let DB=null, isAdmin=false, view={type:"home"}, atab="sec";

// ---- preturi ----
function userPrices(){try{return JSON.parse(localStorage.getItem(PKEY)||"{}")}catch(e){return {}}}
function setUserPrice(id,v){const o=userPrices(); if(v==null||v===""){delete o[id];} else o[id]=Number(v); try{localStorage.setItem(PKEY,JSON.stringify(o))}catch(e){}}
function matById(id){return (DB.mats||[]).find(m=>m.id===id);}
function priceOf(id){const up=userPrices(); if(id in up)return up[id]; const m=matById(id); return m?Number(m.price||0):0;}

// ---- structura ----
function sections(){return (DB.sections||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));}
function cats(){return (DB.cats||[]).slice().sort((a,b)=>(a.order||0)-(b.order||0));}
function itemsOf(cid){return (DB.items||[]).filter(i=>i.cat===cid);}
function catsOfSec(sid){return cats().filter(c=>c.sec===sid);}
function orphanCats(){const ids=new Set((DB.sections||[]).map(s=>s.id));return cats().filter(c=>!c.sec||!ids.has(c.sec));}

async function boot(){
  try{ DB=await fetch("/api/tools").then(r=>r.json()); }catch(e){ DB=null; }
  if(!DB||!Array.isArray(DB.cats)){ DB=JSON.parse(JSON.stringify(CATALOG)); }
  if(!Array.isArray(DB.sections)) DB.sections=[];
  try{ isAdmin=(await fetch("/api/admin/me").then(r=>r.json())).admin; }catch(e){ isAdmin=false; }
  buildNav(); routeHome();
}

// ---- sidebar (Sectiune > Categorie > Item) ----
function buildNav(filter){
  filter=(filter||"").toLowerCase();
  const nav=$("#nav"); nav.innerHTML="";
  const renderSec=(sec,catList)=>{
    if(filter){ catList=catList.filter(c=>itemsOf(c.id).some(i=>i.name.toLowerCase().includes(filter))); if(!catList.length)return; }
    if(!catList.length && !filter && sec.id==="__orphan")return;
    const secEl=document.createElement("div"); secEl.className="secgrp"+((filter||view.sec===sec.id)?" open":"");
    const sh=document.createElement("div"); sh.className="secgrphead";
    sh.innerHTML=`<span>${esc(sec.name)}</span><span class="chev">▶</span>`;
    sh.onclick=()=>secEl.classList.toggle("open");
    const sb=document.createElement("div"); sb.className="secgrpbody";
    catList.forEach(c=>{
      let items=itemsOf(c.id);
      if(filter) items=items.filter(i=>i.name.toLowerCase().includes(filter));
      const grp=document.createElement("div"); grp.className="grp"+((filter||c.id===view.cat)?" open":"");
      const hd=document.createElement("div"); hd.className="grphead";
      hd.innerHTML=`<span>${esc(c.name)}</span><span class="chev">▶</span>`;
      hd.onclick=(e)=>{e.stopPropagation();grp.classList.toggle("open");};
      const body=document.createElement("div"); body.className="grpbody";
      if(!items.length){ const e2=document.createElement("div"); e2.className="navitem empty"; e2.textContent="(gol)"; body.appendChild(e2); }
      items.forEach(it=>{
        const el=document.createElement("div"); el.className="navitem"+(view.type==="item"&&view.id===it.id?" active":"");
        el.innerHTML=(it.icon?`<img src="${iconURL(it.icon)}" onerror="this.style.visibility='hidden'">`:`<span class="dot"></span>`)+`<span>${esc(it.name)}</span>`;
        el.onclick=()=>{ routeItem(it.id); closeNav(); };
        body.appendChild(el);
      });
      grp.appendChild(hd); grp.appendChild(body); sb.appendChild(grp);
    });
    secEl.appendChild(sh); secEl.appendChild(sb); nav.appendChild(secEl);
  };
  sections().forEach(sec=>renderSec(sec,catsOfSec(sec.id)));
  const orph=orphanCats(); if(orph.length) renderSec({id:"__orphan",name:"Diverse"},orph);
  $("#adminNav").innerHTML=`<span class="dot" style="background:var(--gold)"></span> ${isAdmin?"Admin ✓":"Admin"}`;
}
$("#search").addEventListener("input",e=>buildNav(e.target.value));
$("#burger").onclick=()=>document.body.classList.toggle("nav-open");
$("#scrim").onclick=closeNav;
function closeNav(){document.body.classList.remove("nav-open");}
$("#adminNav").onclick=()=>{ routeAdmin(); closeNav(); };

// ---- rutare ----
function setCrumbs(h){$("#crumbs").innerHTML=h;}
function routeHome(){ view={type:"home"}; buildNav($("#search").value); setCrumbs("Unelte");
  const secList=sections().map(s=>{const n=catsOfSec(s.id).length;
    return `<div style="margin-bottom:6px"><b style="color:var(--gold2);font-family:Cinzel,serif">${esc(s.name)}</b>
      <span class="dim">· ${n} categorii</span></div>`;}).join("");
  $("#content").innerHTML=`<div class="ihead"><div class="ic">🛠️</div><div><h2>Unelte Baerim</h2>
    <div class="desc">Alege un item din stânga (Chapter → categorie → item) pentru calculatorul de upgrade cu materiale. Prețurile le setezi în „Materiale" și rămân salvate pentru tine.</div></div></div>
    <div class="sect">Secțiuni</div><div class="card">${secList||'<div class="muted">Nimic încă. Intră în Admin → Importă catalog, sau adaugă manual.</div>'}</div>`;
}
function routeItem(id){
  const it=(DB.items||[]).find(x=>x.id===id); if(!it)return routeHome();
  if(it.kind==="mokoko"){ view={type:"mokoko"}; buildNav($("#search").value); renderMokoko(); return; }
  const c=(DB.cats||[]).find(x=>x.id===it.cat), s=c&&(DB.sections||[]).find(x=>x.id===c.sec);
  view={type:"item",id,cat:it.cat,sec:c?c.sec:null}; buildNav($("#search").value);
  setCrumbs(`Unelte › ${s?esc(s.name)+" › ":""}${esc(c?c.name:"")} › <b>${esc(it.name)}</b>`);
  $("#content").innerHTML=renderItem(it);
}
function routeMateriale(){ view={type:"mat"}; buildNav($("#search").value); setCrumbs("Unelte › <b>Materiale</b>"); $("#content").innerHTML=renderMateriale(); }

// ---- item: matrice vizuala ----
function stageCost(lv){ let m=0; (lv.mats||[]).forEach(mm=>m+=priceOf(mm.m)*(mm.q||0)); return (lv.tax||0)+m; }
function matCell(mm){
  const m=matById(mm.m), nm=m?m.name:"?";
  const ic=(m&&m.vnum)?`<img src="${iconURL(m.vnum)}" onerror="this.parentNode.textContent='?'">`:"◆";
  return `<span class="mcell" title="${esc(nm)}"><span class="micon">${ic}</span><span class="q">×${mm.q}</span></span>`;
}
function renderItem(it){
  const ic=it.icon?`<img src="${iconURL(it.icon)}" onerror="this.replaceWith(document.createTextNode('🗡️'))">`:"🗡️";
  let html=`<div class="ihead"><div class="ic">${ic}</div><div><h2>${esc(it.name)}</h2>${it.desc?`<div class="desc">${esc(it.desc)}</div>`:""}</div>
    ${isAdmin?`<button class="btn ghost sm editbtn" onclick="routeAdmin('item','${it.id}')">✎ Editează</button>`:""}</div>`;
  const lv=it.levels||[];
  if(it.kind!=="upgrade"||!lv.length){ html+=`<div class="card muted">Fără tabel de upgrade. ${isAdmin?'Adaugă pași în Admin.':''}</div>`; return html; }
  const maxSlots=Math.max(1,...lv.map(l=>(l.mats||[]).length));
  const hasChance=lv.some(l=>l.chance!=null&&l.chance!=="");
  let total=0; lv.forEach(l=>total+=stageCost(l));
  let head=`<tr><th class="mlbl">Material</th>`+lv.map(l=>`<th>+${l.to}</th>`).join("")+`</tr>`;
  let rows="";
  for(let s=0;s<maxSlots;s++){
    rows+=`<tr><td class="mlbl"></td>`+lv.map(l=>{const mm=(l.mats||[])[s];return `<td>${mm?matCell(mm):'<span class="dash">–</span>'}</td>`;}).join("")+`</tr>`;
  }
  if(hasChance) rows+=`<tr class="chance"><td class="mlbl">Șansă</td>`+lv.map(l=>`<td>${(l.chance!=null&&l.chance!=="")?l.chance+"%":"–"}</td>`).join("")+`</tr>`;
  rows+=`<tr class="pret"><td class="mlbl">Preț</td>`+lv.map(l=>`<td>${kk(l.tax||0)}</td>`).join("")+`</tr>`;
  html+=`<div class="sect">Îmbunătățire</div><div class="matrixwrap"><table class="matrix">${head}${rows}</table></div>
    <div class="total">Total (taxe + materiale): <b>${kk(total)}</b></div>`;
  if((it.recipe||[]).length){
    const chips=it.recipe.map(mm=>{const m=matById(mm.m);return `<span class="matchip"><span class="q">${mm.q}×</span> ${esc(m?m.name:"?")}</span>`;}).join("");
    html+=`<div class="sect">Rețetă craft</div><div class="card">${chips}</div>`;
  }
  html+=`<div class="dim" style="margin-top:14px;font-size:12px">Prețurile materialelor se setează în <a href="#" onclick="routeMateriale();return false">Materiale</a> și rămân salvate pentru tine.</div>`;
  return html;
}

function renderMateriale(){
  const up=userPrices();
  const rows=(DB.mats||[]).map(m=>{
    const uv=(m.id in up)?up[m.id]:"";
    return `<tr><td class="lbl">${m.vnum?`<img src="${iconURL(m.vnum)}" style="width:20px;height:20px;vertical-align:middle;margin-right:6px" onerror="this.style.display='none'">`:""}${esc(m.name)}</td>
      <td class="num dim">${m.vnum||"—"}</td><td class="num">${fmt(m.price||0)}</td>
      <td><input class="inp num" style="width:130px" type="number" min="0" placeholder="al meu…" value="${uv}" oninput="setUserPrice('${m.id}',this.value)"></td></tr>`;
  }).join("");
  return `<div class="ihead"><div class="ic">💰</div><div><h2>Materiale &amp; prețuri</h2>
    <div class="desc">Prețul „de bază" e setat de admin. Poți pune prețul tău (dreapta) — se salvează doar pentru tine.</div></div>
    ${isAdmin?`<button class="btn ghost sm editbtn" onclick="routeAdmin('mat')">✎ Editează baza</button>`:""}</div>
    <div class="tblwrap"><table class="simple"><tr><th class="lbl">Material</th><th>vnum</th><th>Preț bază</th><th>Prețul meu</th></tr>${rows||'<tr><td class="muted" colspan="4">Niciun material încă.</td></tr>'}</table></div>`;
}

// ================= ADMIN =================
async function routeAdmin(tab,focusId){
  try{ isAdmin=(await fetch("/api/admin/me").then(r=>r.json())).admin; }catch(e){}
  if(PREVIEW&&window.__prevAdmin) isAdmin=true;
  view={type:"admin"}; buildNav($("#search").value); setCrumbs("Unelte › <b>Admin</b>");
  if(!isAdmin) return renderAdminLogin();
  if(tab)atab=tab; renderAdmin(focusId);
}
function renderAdminLogin(){
  $("#content").innerHTML=`<div class="login"><div class="card">
    <h2>Admin</h2><p>Introdu parola de administrator ca să editezi uneltele.</p>
    <input id="apw" class="inp" style="width:100%" type="password" autocomplete="current-password" placeholder="Parolă admin" autofocus>
    <button class="btn" style="width:100%;margin-top:12px" id="alogin">Intră</button>
    <div class="err" id="aerr">${PREVIEW?'<span class="dim">Previzualizare — orice parolă intră.</span>':''}</div></div></div>`;
  const go=async()=>{
    const pw=$("#apw").value, err=$("#aerr");
    if(PREVIEW){ window.__prevAdmin=true; isAdmin=true; buildNav(); renderAdmin(); return; }
    err.textContent="";
    try{
      const r=await fetch("/api/admin/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
      if(r.ok){ isAdmin=true; buildNav(); renderAdmin(); return; }
      const j=await r.json().catch(()=>({}));
      err.textContent=j.error==="unconfigured"?"ADMIN_PASSWORD nu e setat încă în Cloudflare.":"Parolă greșită.";
    }catch(e){ err.textContent="Eroare de rețea."; }
  };
  $("#alogin").onclick=go; $("#apw").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}
function renderAdmin(focusId){
  const tabs=[["sec","Secțiuni"],["cat","Categorii"],["item","Iteme"],["mat","Materiale"]];
  $("#content").innerHTML=`<div class="spread"><div class="tabs">`+
    tabs.map(t=>`<div class="tab ${atab===t[0]?"on":""}" onclick="atab='${t[0]}';renderAdmin()">${t[1]}</div>`).join("")+
    `</div><div class="row"><button class="btn ghost sm" onclick="importCatalog()">⭳ Importă catalog Baerim</button>
      <button class="btn ghost sm" onclick="adminLogout()">Ieși</button></div></div><div id="ed"></div>
    <div class="savebar"><span class="st" id="savest"></span>
      <button class="btn ghost" onclick="reloadDB()">Reîncarcă</button>
      <button class="btn" onclick="saveDB()">💾 Salvează tot</button></div>`;
  if(atab==="sec")edSecs(); else if(atab==="cat")edCats(); else if(atab==="mat")edMats(); else edItems(focusId);
}
async function adminLogout(){ try{await fetch("/api/admin/logout",{method:"POST",credentials:"same-origin"})}catch(e){} window.__prevAdmin=false; isAdmin=false; buildNav(); routeHome(); }
async function reloadDB(){ try{DB=await fetch("/api/tools").then(r=>r.json()); if(!Array.isArray(DB.sections))DB.sections=[];}catch(e){} mark("Reîncărcat de pe server."); renderAdmin(); buildNav(); }
function importCatalog(){
  if(!confirm('Import: adauga Chapter 1/2/PVP, categoriile din Chapter 1 si itemul 75lvl weapon. Ce ai acum se inlocuieste. Continui?'))return;
  DB=JSON.parse(JSON.stringify(CATALOG)); DB.updated_at=DB.updated_at||0; dirty(); buildNav(); renderAdmin("i_75weapon");
  mark("Catalog incarcat. Verifica si apasa Salveaza tot.");
}

// -- sectiuni --
function edSecs(){
  const list=sections().map(s=>`<div class="erow sec">
    <input class="inp" value="${esc(s.name)}" oninput="setField('sec','${s.id}','name',this.value)">
    <input class="inp num" type="number" value="${s.order||0}" oninput="setField('sec','${s.id}','order',this.value)" title="ordine">
    <button class="btn danger sm" onclick="delSec('${s.id}')">✕</button></div>`).join("");
  $("#ed").innerHTML=`<div class="muted" style="margin-bottom:10px">Secțiunile de sus (ex. Chapter 1, Chapter 2, PVP). Sub fiecare pui categorii (tab „Categorii").</div>
    ${list}<button class="btn ghost sm" onclick="addSec()">+ Secțiune</button>`;
}
function addSec(){ DB.sections=DB.sections||[]; DB.sections.push({id:uid("s"),name:"Secțiune nouă",order:(Math.max(0,...DB.sections.map(s=>s.order||0))+10)}); dirty(); edSecs(); buildNav(); }
function delSec(id){ if(catsOfSec(id).length && !confirm('Sectiunea are categorii. Stergi? (categoriile trec la Diverse)'))return; DB.sections=DB.sections.filter(s=>s.id!==id); dirty(); edSecs(); buildNav(); }

// -- categorii --
function edCats(){
  const secOpts=sections().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  const list=cats().map(c=>`<div class="erow cat">
    <input class="inp" value="${esc(c.name)}" oninput="setField('cat','${c.id}','name',this.value)">
    <select class="inp" onchange="setField('cat','${c.id}','sec',this.value);buildNav()"><option value="">— fără secțiune —</option>${secOpts.replace(`value="${c.sec}"`,`value="${c.sec}" selected`)}</select>
    <input class="inp num" type="number" value="${c.order||0}" oninput="setField('cat','${c.id}','order',this.value)" title="ordine">
    <button class="btn danger sm" onclick="delCat('${c.id}')">✕</button></div>`).join("");
  $("#ed").innerHTML=`<div class="muted" style="margin-bottom:10px">Categoriile (sub-categorii) și secțiunea din care fac parte.</div>
    <div class="erow cat" style="background:transparent;border:0;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px"><span>Nume</span><span>Secțiune</span><span>Ordine</span><span></span></div>
    ${list}<button class="btn ghost sm" onclick="addCat()">+ Categorie</button>`;
}
function addCat(){ const s=sections()[0]; DB.cats=DB.cats||[]; DB.cats.push({id:uid("c"),name:"Categorie nouă",order:(Math.max(0,...DB.cats.map(c=>c.order||0))+10),sec:s?s.id:""}); dirty(); edCats(); buildNav(); }
function delCat(id){ if(itemsOf(id).length && !confirm("Categoria are iteme. Ștergi oricum?"))return; DB.cats=DB.cats.filter(c=>c.id!==id); dirty(); edCats(); buildNav(); }

// -- materiale --
function edMats(){
  const list=(DB.mats||[]).map(m=>`<div class="erow mat">
    <span class="iconprev" id="mpv_${m.id}">${m.vnum?`<img src="${iconURL(m.vnum)}" onerror="this.style.display='none'">`:"·"}</span>
    <input class="inp" value="${esc(m.name)}" oninput="setField('mat','${m.id}','name',this.value)" placeholder="nume">
    <div class="row" style="gap:4px"><input class="inp num" style="flex:1;min-width:0" type="number" value="${m.vnum||""}" oninput="setField('mat','${m.id}','vnum',this.value);updMatPrev('${m.id}',this.value)" placeholder="vnum"><button class="btn ghost sm" type="button" onclick="pickIcon('mat','${m.id}')">🔍</button></div>
    <input class="inp num" type="number" value="${m.price||0}" oninput="setField('mat','${m.id}','price',this.value)" placeholder="preț bază">
    <button class="btn danger sm" onclick="delMat('${m.id}')">✕</button></div>`).join("");
  $("#ed").innerHTML=`<div class="muted" style="margin-bottom:10px">Baza de prețuri. „vnum" = id-ul itemului pentru iconiță (m2icondb). Prețul de aici e citit de toate calculatoarele.</div>
    <div class="erow mat" style="background:transparent;border:0;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px"><span></span><span>Nume</span><span>vnum</span><span>Preț bază</span><span></span></div>
    ${list}<button class="btn ghost sm" onclick="addMat()">+ Material</button>`;
}
function addMat(){ DB.mats=DB.mats||[]; DB.mats.push({id:uid("m"),name:"Material nou",vnum:0,price:0}); dirty(); edMats(); }
function delMat(id){ DB.mats=DB.mats.filter(m=>m.id!==id); dirty(); edMats(); }

// -- iteme --
function edItems(focusId){
  const opts=cats().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  const cards=(DB.items||[]).map(it=>{
    const open=it.id===focusId;
    return `<div class="itemcard${open?" open":""}" id="ic_${it.id}">
      <div class="itemhd" onclick="document.getElementById('ic_${it.id}').classList.toggle('open')">
        <span class="iconprev" id="ipv_${it.id}">${it.icon?`<img src="${iconURL(it.icon)}" onerror="this.style.display='none'">`:"·"}</span>
        <span class="nm">${esc(it.name)||"(fără nume)"}</span>
        <span class="dim">${esc((cats().find(c=>c.id===it.cat)||{}).name||"fără categorie")}</span>
        <span class="chev">▶</span></div>
      <div class="itembody">
        <div class="grid2f">
          <div class="field"><label>Nume</label><input class="inp" value="${esc(it.name)}" oninput="setField('item','${it.id}','name',this.value);document.querySelector('#ic_${it.id} .nm').textContent=this.value"></div>
          <div class="field"><label>Categorie</label><select class="inp" onchange="setField('item','${it.id}','cat',this.value);buildNav()">${opts.replace(`value="${it.cat}"`,`value="${it.cat}" selected`)}</select></div>
          <div class="field"><label>Iconiță (vnum m2icondb)</label><div class="row"><input class="inp num" style="flex:1" type="number" value="${it.icon||""}" placeholder="ex. 40817" oninput="setField('item','${it.id}','icon',this.value);updIconPrev('${it.id}',this.value)"><button class="btn ghost sm" type="button" onclick="pickIcon('item','${it.id}')">🔍 Alege</button></div></div>
          <div class="field"><label>Tip</label><select class="inp" onchange="setField('item','${it.id}','kind',this.value);renderAdmin('${it.id}')">
            <option value="upgrade"${it.kind==="upgrade"?" selected":""}>Upgrade (cu matrice)</option>
            <option value="info"${it.kind==="info"?" selected":""}>Info (doar text)</option></select></div>
        </div>
        <div class="field"><label>Descriere</label><textarea class="inp" rows="2" oninput="setField('item','${it.id}','desc',this.value)">${esc(it.desc)}</textarea></div>
        ${it.kind==="upgrade"?edLevels(it):""}
        <div class="row" style="margin-top:10px"><button class="btn danger sm" onclick="delItem('${it.id}')">🗑 Șterge itemul</button></div>
      </div></div>`;
  }).join("");
  $("#ed").innerHTML=`<div class="muted" style="margin-bottom:10px">Adaugă/editează iteme. Clic pe un item ca să-l deschizi. Matricea vizuală (materiale + preț pe treaptă) apare automat din pașii de mai jos.</div>
    ${cards||'<div class="muted">Niciun item încă.</div>'}<button class="btn ghost sm" style="margin-top:6px" onclick="addItem()">+ Item</button>`;
}
function updIconPrev(id,v){ const el=document.getElementById("ipv_"+id); if(el)el.innerHTML=v?`<img src="${iconURL(v)}" onerror="this.style.display='none'">`:"·"; }
function matOptions(sel){return (DB.mats||[]).map(m=>`<option value="${m.id}"${m.id===sel?" selected":""}>${esc(m.name)}</option>`).join("");}
function edLevels(it){
  const rows=(it.levels||[]).map((lv,i)=>{
    const mats=(lv.mats||[]).map((mm,j)=>`<span class="lvmat">
      <select class="inp sm" onchange="setLevMat('${it.id}',${i},${j},'m',this.value)">${matOptions(mm.m)}</select>
      <input class="inp num" style="width:52px" type="number" value="${mm.q||1}" onchange="setLevMat('${it.id}',${i},${j},'q',this.value)">
      <button class="btn danger sm" onclick="delLevMat('${it.id}',${i},${j})">✕</button></span>`).join("");
    return `<div class="lvrow">
      <input class="inp num" type="number" value="${lv.to}" onchange="setLev('${it.id}',${i},'to',this.value)" title="nivel (+)">
      <input class="inp num" type="number" value="${lv.tax||0}" onchange="setLev('${it.id}',${i},'tax',this.value)" title="taxă yang">
      <input class="inp num" type="number" value="${lv.chance!=null?lv.chance:''}" onchange="setLev('${it.id}',${i},'chance',this.value)" title="șansă % (opțional)" placeholder="%">
      <div class="mats">${mats}<button class="btn ghost sm" onclick="addLevMat('${it.id}',${i})">+ mat</button></div>
      <button class="btn danger sm" onclick="delLev('${it.id}',${i})">✕</button></div>`;
  }).join("");
  return `<div class="field"><label>Pași upgrade — nivel · taxă · șansă% (opțional) · materiale</label>${rows}
    <button class="btn ghost sm" style="margin-top:4px" onclick="addLev('${it.id}')">+ Pas</button></div>`;
}
function addItem(){ const c=cats()[0]; DB.items=DB.items||[]; const it={id:uid("i"),cat:c?c.id:"",name:"Item nou",icon:0,desc:"",kind:"upgrade",recipe:[],levels:[]}; DB.items.push(it); dirty(); edItems(it.id); buildNav(); }
function delItem(id){ if(!confirm("Ștergi itemul?"))return; DB.items=DB.items.filter(i=>i.id!==id); dirty(); edItems(); buildNav(); }
function itById(id){return DB.items.find(i=>i.id===id);}
function addLev(id){ const it=itById(id); it.levels=it.levels||[]; const last=it.levels.slice(-1)[0]; it.levels.push({to:(last?last.to+1:1),tax:0,chance:null,mats:[]}); dirty(); renderAdmin(id); }
function delLev(id,i){ itById(id).levels.splice(i,1); dirty(); renderAdmin(id); }
function setLev(id,i,f,v){ const it=itById(id); it.levels[i][f]=(f==="chance"&&(v===""||v==null))?null:Number(v); dirty(true); }
function addLevMat(id,i){ const it=itById(id); const m=(DB.mats||[])[0]; it.levels[i].mats=it.levels[i].mats||[]; it.levels[i].mats.push({m:m?m.id:"",q:1}); dirty(); renderAdmin(id); }
function delLevMat(id,i,j){ itById(id).levels[i].mats.splice(j,1); dirty(); renderAdmin(id); }
function setLevMat(id,i,j,f,v){ const it=itById(id); it.levels[i].mats[j][f]=f==="q"?Number(v):v; dirty(true); }

function setField(kind,id,f,v){
  let arr=kind==="sec"?DB.sections:kind==="cat"?DB.cats:kind==="mat"?DB.mats:DB.items;
  const o=(arr||[]).find(x=>x.id===id); if(!o)return;
  if(f==="order"||f==="vnum"||f==="price"||f==="icon") v=Number(v)||0;
  o[f]=v; dirty(true);
}
let dirtyFlag=false;
function dirty(){ dirtyFlag=true; mark("Modificări nesalvate."); }
function mark(t){ const s=$("#savest"); if(s)s.textContent=t; }
async function saveDB(){
  mark("Se salvează…");
  if(PREVIEW){ mark("Previzualizare — nu se salvează pe server (doar pe deliricbae.ro)."); return; }
  try{
    const r=await fetch("/api/tools",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(DB)});
    const j=await r.json().catch(()=>({}));
    if(r.ok){ dirtyFlag=false; mark("Salvat ✓ ("+new Date().toLocaleTimeString("ro-RO")+")"); }
    else mark("Eroare: "+(j.error||r.status)+(r.status===401?" — reintră în admin.":""));
  }catch(e){ mark("Eroare de rețea."); }
}
window.addEventListener("beforeunload",e=>{ if(dirtyFlag){ e.preventDefault(); e.returnValue=""; } });


// ===== Mokoko: harti + puncte + hover coordonate + bifat (local) =====
const MK_ORDER=["Shinsoo","Chunjo","Jinno","Neutral"];
const mkKey=id=>"mokoko_"+id;
function mkGetDone(id){try{return new Set(JSON.parse(localStorage.getItem(mkKey(id))||"[]"))}catch(e){return new Set()}}
function mkSetDone(id,set){try{localStorage.setItem(mkKey(id),JSON.stringify([...set]))}catch(e){}}
let mkCur=null, mkHide=false;
function renderMokoko(){
  if(!mkCur||!MOKOKO.some(m=>m.id===mkCur)) mkCur=MOKOKO[0]&&MOKOKO[0].id;
  setCrumbs("Unelte › Sisteme › <b>Harta Mokoko</b>");
  const groups={}; MOKOKO.forEach(m=>{(groups[m.kingdom]=groups[m.kingdom]||[]).push(m);});
  let list="";
  MK_ORDER.forEach(k=>{ if(!groups[k])return;
    list+=`<div class="mkgrp">${esc(k)}</div>`+groups[k].map(m=>{
      const d=mkGetDone(m.id).size;
      return `<div class="mkmap ${m.id===mkCur?"on":""}" onclick="mkCur='${m.id}';renderMokoko()">${esc(m.name)}<span class="c">${d}/${m.n}</span></div>`;
    }).join(""); });
  Object.keys(groups).filter(k=>!MK_ORDER.includes(k)).forEach(k=>{
    list+=`<div class="mkgrp">${esc(k)}</div>`+groups[k].map(m=>`<div class="mkmap ${m.id===mkCur?"on":""}" onclick="mkCur='${m.id}';renderMokoko()">${esc(m.name)}<span class="c">${mkGetDone(m.id).size}/${m.n}</span></div>`).join("");
  });
  $("#content").innerHTML=`<div class="ihead"><div class="ic">🗺️</div><div><h2>Harta interactivă Mokoko</h2>
    <div class="desc">Alege harta din stânga. Treci cu mouse-ul peste un punct ca să vezi coordonatele; clic = bifat (se salvează pentru tine).</div></div></div>
    <div class="mkwrap"><div class="mklist">${list}</div><div class="mkright" id="mkright"></div></div>`;
  mkBoard();
}
function mkBoard(){
  const m=MOKOKO.find(x=>x.id===mkCur); if(!m){$("#mkright").innerHTML="";return;}
  const done=mkGetDone(m.id);
  const pts=m.coords.map((p,i)=>{
    if(mkHide&&done.has(i))return "";
    const l=(p.x*(m.sx||1)/m.w*100), t=(p.y*(m.sy||1)/m.h*100);
    return `<div class="mkpt ${done.has(i)?"done":""}" style="left:${l.toFixed(2)}%;top:${t.toFixed(2)}%" data-xy="X: ${p.x} · Y: ${p.y}" onclick="mkToggle(${i})" onmouseenter="mkTip(this)" onmouseleave="mkUntip()"></div>`;
  }).join("");
  $("#mkright").innerHTML=`<div class="mkbar"><span class="cnt">${done.size}/${m.n} colectate</span>
    <button class="btn ghost sm" onclick="mkReset()">Reset</button>
    <label><input type="checkbox" ${mkHide?"checked":""} onchange="mkHide=this.checked;mkBoard()"> Ascunde bifate</label></div>
    <div class="mkboard" id="mkboard"><img src="${m.img}" alt="${esc(m.name)}" loading="lazy">${pts}</div>`;
}
function mkToggle(i){const m=MOKOKO.find(x=>x.id===mkCur);const d=mkGetDone(m.id);d.has(i)?d.delete(i):d.add(i);mkSetDone(m.id,d);mkBoard();
  const el=[...document.querySelectorAll('.mkmap')].find(e=>e.classList.contains('on'));}
function mkReset(){const m=MOKOKO.find(x=>x.id===mkCur);if(confirm("Ștergi bifările pentru "+m.name+"?")){mkSetDone(m.id,new Set());renderMokoko();}}
function mkTip(el){const b=document.getElementById("mkboard");if(!b)return;mkUntip();const t=document.createElement("div");t.className="mktip";t.id="mktip";t.textContent=el.dataset.xy;t.style.left=el.style.left;t.style.top=el.style.top;b.appendChild(t);}
function mkUntip(){const t=document.getElementById("mktip");if(t)t.remove();}

// ===== icon picker (baza interna m2icondb, /icons.json) =====
let ICONS=null, iconTarget=null;
async function loadIcons(){ if(ICONS)return ICONS; try{ICONS=await fetch('/icons.json').then(r=>r.json());}catch(e){ICONS=[];} return ICONS; }
async function pickIcon(kind,id){
  iconTarget={kind,id}; $("#iconModal").classList.add("on");
  const s=$("#iconSearch"); s.value=""; $("#iconGrid").innerHTML='<div class="dim" style="padding:20px">Se încarcă…</div>';
  await loadIcons(); renderIconGrid(""); s.focus();
}
function closeIconModal(){ $("#iconModal").classList.remove("on"); iconTarget=null; }
function renderIconGrid(q){
  q=(q||"").trim().toLowerCase(); let list=ICONS||[];
  if(q){ const num=/^\d+$/.test(q); list=list.filter(e=> e.n.toLowerCase().includes(q) || (num&&String(e.i).includes(q)) ); }
  const shown=list.slice(0,300);
  $("#iconGrid").innerHTML=shown.map(e=>`<div class="ic" onclick="chooseIcon(${e.c})" title="${esc(e.n)} · ${e.i}">
    <img src="${iconURL(e.c)}" loading="lazy" onerror="this.style.visibility='hidden'"><span class="nm">${esc(e.n)}</span><span class="vn">${e.i}</span></div>`).join("")
    || '<div class="dim" style="padding:20px">Nimic găsit.</div>';
  const s=$("#iconCount"); if(s)s.textContent=`${list.length} rezultate`+(list.length>300?" (arăt 300)":"");
}
function chooseIcon(vnum){
  if(!iconTarget)return; const {kind,id}=iconTarget; closeIconModal();
  if(kind==="item"){ setField('item',id,'icon',vnum); renderAdmin(id); }
  else { setField('mat',id,'vnum',vnum); renderAdmin(); }
}
function updMatPrev(id,v){ const el=document.getElementById("mpv_"+id); if(el)el.innerHTML=v?`<img src="${iconURL(v)}" onerror="this.style.display='none'">`:"·"; }
$("#iconSearch").addEventListener("input",e=>renderIconGrid(e.target.value));
$("#iconModal").addEventListener("click",e=>{ if(e.target.id==="iconModal")closeIconModal(); });

boot();
</script>
